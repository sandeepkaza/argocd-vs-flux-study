apiVersion: v1
kind: Namespace
metadata:
  name: gitops-flux
---
apiVersion: v1
kind: Secret
metadata:
  name: corpus-auth
  namespace: flux-system
stringData:
  username: bench
  password: benchpw123
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: corpus
  namespace: flux-system
spec:
  interval: 1m
  url: http://gitea-http.gitea.svc:3000/bench/corpus.git
  ref:
    branch: main
  secretRef:
    name: corpus-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m
  path: ./apps
  prune: true
  targetNamespace: gitops-flux
  sourceRef:
    kind: GitRepository
    name: corpus
