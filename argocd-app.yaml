apiVersion: v1
kind: Namespace
metadata:
  name: gitops-argocd
---
apiVersion: v1
kind: Secret
metadata:
  name: corpus-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: http://gitea-http.gitea.svc:3000/bench/corpus.git
  username: bench
  password: benchpw123
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc:3000/bench/corpus.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
